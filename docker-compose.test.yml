# The test environment: an in-memory database, migrated every time it starts
name: auth-platform-test

services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    # Durability isn't needed for a database that only lives during the tests
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  auth-api-migrate:
    extends:
      file: docker-compose.base.yml
      service: auth-api-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file: workspaces/auth-api/.env.test

  auth-api:
    extends:
      file: docker-compose.base.yml
      service: auth-api
    depends_on:
      auth-api-migrate:
        condition: service_completed_successfully
    env_file: workspaces/auth-api/.env.test

  auth-backoffice:
    extends:
      file: docker-compose.base.yml
      service: auth-backoffice
    depends_on:
      auth-api:
        condition: service_healthy
