name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build-all

      - name: Check types
        run: yarn run-all-parallel check-types:all

      - name: Lint
        run: yarn run-all-parallel lint

      # auth-api's tests start their own database with docker compose
      - name: Test
        run: yarn run-all test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install the Playwright browser
        run: yarn auth-backoffice:run test:e2e:install

      # Starts auth-api's test database and API container with docker compose
      - name: Test
        run: yarn test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: workspaces/auth-backoffice/playwright-report
          retention-days: 7
