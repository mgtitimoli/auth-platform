# The demo environment: the whole project from its images, to try it without
# setting anything up (yarn demo); every run starts from a fresh database with
# the seeded admin
name: auth-platform-demo

services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres

  auth-api-migrate:
    extends:
      file: docker-compose.base.yml
      service: auth-api-migrate
    command:
      - sh
      - -c
      - yarn workspace @mgtitimoli/auth-api database:migrate-all && yarn workspace @mgtitimoli/auth-api database:seed 00001-seed-admin-users
    depends_on:
      postgres:
        condition: service_healthy
    env_file: workspaces/auth-api/.env.demo

  auth-api:
    extends:
      file: docker-compose.base.yml
      service: auth-api
    depends_on:
      auth-api-migrate:
        condition: service_completed_successfully
    env_file: workspaces/auth-api/.env.demo

  auth-backoffice:
    extends:
      file: docker-compose.base.yml
      service: auth-backoffice
    depends_on:
      auth-api:
        condition: service_healthy
