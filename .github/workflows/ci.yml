name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version-file: .tool-versions

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build-all

      - name: Check types
        run: yarn run-all-parallel check-types:all

      - name: Lint
        run: yarn run-all-parallel lint

      # Starts auth-api's test database with docker compose
      - name: Test auth-api
        run: yarn test-auth-api

      - name: Test the other workspaces
        run: yarn workspaces foreach --all --exclude @mgtitimoli/auth-api --verbose run test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version-file: .tool-versions

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install the Playwright browser
        run: yarn auth-backoffice:run prepare-e2e

      # The compose files read the test environment's variables
      - name: Load the test environment
        run: cat workspaces/auth-api/.env.test >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds the test environment's images with GitHub Actions' cache, so
      # the test step's compose build reuses unchanged layers
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.test.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
          source: .

      - name: Test
        run: yarn test-e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: workspaces/auth-backoffice/playwright-report
          retention-days: 7
