# The Postgres every environment uses, extended by docker-compose.<environment>.yml
# (never run on its own)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_USER: auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 1s
      retries: 30
      timeout: 5s
