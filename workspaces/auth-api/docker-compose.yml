name: auth-api

x-postgres: &postgres
  image: postgres:16
  environment:
    POSTGRES_DB: auth
    POSTGRES_PASSWORD: auth
    POSTGRES_USER: auth
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
    interval: 1s
    retries: 30
    timeout: 5s

services:
  postgres:
    <<: *postgres
    container_name: auth-api-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-test:
    <<: *postgres
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    container_name: auth-api-postgres-test
    ports:
      - "5433:5432"
    profiles: ["test"]
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
